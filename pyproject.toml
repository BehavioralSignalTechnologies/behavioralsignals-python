[project]
name = "behavioralsignals"
version = "0.7.0"
description = "Official Python SDK for the Behavioral Signals API: voice emotion/behavior analysis and audio/video deepfake detection"
readme = "README.md"
authors = [{ name = "Behavioral Signal Technologies" }]
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["emotion-recognition", "speech", "voice", "deepfake-detection", "audio", "video", "grpc", "sdk", "mcp"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: Apache Software License",
  "Typing :: Typed"
]

dependencies = [
    "grpcio>=1.73.1",
    "protobuf>=6.31.1",
    "pydantic>=2.11.7",
    "pydub>=0.25.1",
    "requests>=2.32.4",
    "audioop-lts; python_version >= '3.13'"
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.73.1",
    "mcp>=2.2.0,<3",
    "mypy==2.3.1",
    "pytest>=8",
    "pytest-cov>=7",
    "ruff==0.16.8",
    "types-grpcio>=1.83.0",
    "types-protobuf>=7.35.1",
]
mcp = ["mcp>=2.2.0,<3"]

[project.scripts]
behavioralsignals-mcp = "behavioralsignals.mcp_server:main"

[project.urls]
Homepage = "https://behavioralsignals.com/"
Documentation = "https://behavioralsignals.readme.io/"
Repository = "https://github.com/BehavioralSignalTechnologies/behavioralsignals-python"
Issues = "https://github.com/BehavioralSignalTechnologies/behavioralsignals-python/issues"
Changelog = "https://github.com/BehavioralSignalTechnologies/behavioralsignals-python/releases"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
behavioralsignals = ["py.typed"]

[tool.coverage.run]
source = ["behavioralsignals"]
omit = ["*/behavioralsignals/generated/*"]
relative_files = true
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "behavioralsignals.generated.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pydub.*"
ignore_missing_imports = true
